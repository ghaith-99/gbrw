<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة اللاعبين</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>إضافة لاعب جديد</h1>
    <form id="player-form">
        <input type="text" id="player-name" placeholder="اسم اللاعب" required>
        <input type="number" id="player-age" placeholder="العمر" required>
        <input type="number" id="player-height" placeholder="الطول بالمتر" step="0.01">
        <input type="number" id="club-jersey-number" placeholder="رقم القميص في النادي">
        <input type="number" id="national-jersey-number" placeholder="رقم القميص في المنتخب">
        <input type="file" id="player-image" accept="image/*" required>
        <button type="submit">إضافة اللاعب</button>
    </form>

    <h2>قائمة اللاعبين</h2>
    <div id="players-list"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="script.js"></script>
</body>
</html>

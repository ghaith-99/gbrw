<!DOCTYPE html>
<html>
<head>
    <title>إدارة اللاعبين</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        .player-card { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; }
        .player-image { max-width: 100px; }
    </style>
</head>
<body>
    <main class="container">
        <!-- نموذج الإضافة -->
        <article>
            <h2>إضافة لاعب جديد</h2>
            <input type="text" id="name" placeholder="الاسم">
            <input type="number" id="age" placeholder="العمر">
            
            <div>
                <h3>الجنسية</h3>
                <select id="nationality"></select>
                <input type="file" id="newNationality" accept="image/*">
            </div>

            <!-- كرر نفس الهيكل للدوريات والأندية -->
            
            <button onclick="addPlayer()">إضافة</button>
        </article>

        <!-- قائمة اللاعبين -->
        <article id="playersList"></article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي كرة القدم - خمن اللاعب</title>
    <link rel="stylesheet" href="styles.css"> <!-- رابط إلى ملف CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <h1>تحدي كرة القدم</h1>
    <div id="players-container"></div>
   
    <form id="add-player-form">
        <input type="text" id="player-name" placeholder="اسم اللاعب" required>
        <input type="number" id="player-age" placeholder="العمر" required>
        <input type="text" id="player-nationality" placeholder="الجنسية" required>
        <input type="text" id="player-clubs" placeholder="الأندية (مفصولة بفواصل)" required>
        <input type="text" id="player-type" placeholder="النوع" required>
        <input type="text" id="player-image" placeholder="رابط الصورة">
        <button type="submit">إضافة لاعب</button>
    </form>

    <script src="script.js"></script> <!-- رابط إلى ملف JavaScript -->
</body>
</html>
